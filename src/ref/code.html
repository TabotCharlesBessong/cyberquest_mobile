<!doctype html>

<html class="light" lang="en">
  <head>

    <style>
      .confetti {
        position: absolute;
        width: 10px;
        height: 10px;
        z-index: 100;
      }
      @keyframes fall {
        0% {
          transform: translateY(-100vh) rotate(0deg);
          opacity: 1;
        }
        100% {
          transform: translateY(100vh) rotate(720deg);
          opacity: 0;
        }
      }
      .animate-fall {
        animation: fall 3s linear infinite;
      }
      .success-border {
        border: 4px solid #10b981;
      }
      .cyber-bot-jump {
        animation: jump 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) infinite
          alternate;
      }
      @keyframes jump {
        from {
          transform: translateY(0);
        }
        to {
          transform: translateY(-30px);
        }
      }
      .speech-bubble::after {
        content: "";
        position: absolute;
        bottom: -15px;
        left: 50%;
        transform: translateX(-50%);
        border-width: 15px 15px 0;
        border-style: solid;
        border-color: #ffffff transparent transparent;
      }
      .glass-panel {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body
    class="bg-background text-on-surface font-body-md overflow-hidden min-h-screen flex flex-col"
  >
    <!-- Confetti Canvas Container -->
    <div
      class="fixed inset-0 pointer-events-none z-[100]"
      id="confetti-container"
    ></div>
    <!-- Top App Bar -->
    <header
      class="bg-surface/80 backdrop-blur-xl border-b border-white/20 shadow-[0px_10px_30px_rgba(77,150,255,0.1)] flex justify-between items-center w-full px-container-margin-mobile h-16 z-50 sticky top-0"
    >
      <div class="flex items-center gap-3">
        <div
          class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center overflow-hidden border-2 border-white"
        >
          <img
            class="w-full h-full object-cover"
            data-alt="A cute kid hero avatar in a futuristic cyber suit, vibrant blue and white colors, 3D character design style with soft lighting and friendly expression."
            src="https://lh3.googleusercontent.com/aida-public/AB6AXuDN31-WOZKhFKMEB19dg8vsgd2QHcR7nSapliHEsgKC4W7-FQ5JYkY3WI9zwdxjw_UA4IiCxFF_PcnQfwtkRb4y2nJo8LCdZ9QSCXfGgKoWuZ8w3MrEkogZW_0PRsAOE8aZAUet_0C3AenHxhN5Pofjpfji28TVAA8jsw43mfzKKfDYMDh0QlJn0Vc8M8cQJiB7wMmutf6HQplUfKzii8aoGckh-DrfQ-e3t_TvyuXxU-tVJ6OexdNfhQ"
          />
        </div>
        <span
          class="font-headline-md text-headline-md font-extrabold text-primary"
          >CyberQuest</span
        >
      </div>
      <div
        class="bg-secondary-container/20 px-4 py-1.5 rounded-full border border-secondary-container/30"
      >
        <span
          class="font-label-caps text-label-caps text-on-secondary-container"
          >⚡ 450 XP</span
        >
      </div>
    </header>
    <main
      class="flex-grow flex flex-col items-center justify-center px-container-margin-mobile max-w-4xl mx-auto w-full py-12 relative"
    >
      <!-- Progress Bar -->
      <div class="w-full max-w-lg mb-stack-lg">
        <div class="flex justify-between items-center mb-2">
          <span class="font-label-caps text-label-caps text-on-surface-variant"
            >QUEST PROGRESS</span
          >
          <span class="font-label-caps text-label-caps text-primary">80%</span>
        </div>
        <div
          class="w-full h-3 bg-surface-container rounded-full overflow-hidden border border-white/40"
        >
          <div
            class="h-full bg-gradient-to-r from-primary to-secondary w-[80%] rounded-full shadow-inner"
          ></div>
        </div>
      </div>
      <!-- Question Header -->
      <div class="text-center mb-stack-md">
        <h1
          class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-4"
        >
          You received a suspicious link from an unknown sender. What do you do?
        </h1>
      </div>
      <!-- Options Container (Simplified for Feedback State) -->
      <div class="w-full grid gap-4 mb-stack-lg">
        <!-- Option 1: Incorrect -->
        <div
          class="p-5 rounded-lg border-2 border-surface-variant bg-surface opacity-60 flex items-center justify-between transition-all"
        >
          <div class="flex items-center gap-4">
            <div

            >
              A
            </div>
            <p class="font-body-md text-on-surface-variant">
              Click it to see what happens.
            </p>
          </div>
        </div>
        <!-- Option 2: Correct Selection -->
        <div
          class="p-6 rounded-lg glass-panel success-border shadow-[0px_10px_30px_rgba(16,185,129,0.2)] flex items-center justify-between transform scale-[1.02] transition-all relative"
        >
          <div class="flex items-center gap-4">
            <div
              class="w-10 h-10 rounded-full bg-success flex items-center justify-center text-on-primary"
            >
              <span
                class="material-symbols-outlined"
                style="font-variation-settings: &quot;FILL&quot; 1"
                >check_circle</span
              >
            </div>
            <p class="font-body-lg text-success font-bold">

            </p>
          </div>
          <div
            class="bg-success/10 px-3 py-1 rounded-full border border-success/30"
          >
            <span
              class="font-label-caps text-label-caps text-success uppercase tracking-widest"

            >
          </div>
        </div>
        <!-- Option 3: Incorrect -->
        <div
          class="p-5 rounded-lg border-2 border-surface-variant bg-surface opacity-60 flex items-center justify-between transition-all"
        >
          <div class="flex items-center gap-4">
            <div

            >
              C
            </div>
            <p class="font-body-md text-on-surface-variant">
              Reply and ask who they are.
            </p>
          </div>
        </div>
      </div>
      <!-- Mascot Interaction Area -->

        <div

            data-alt="A friendly blue and white spherical robot mascot named Cyber-Bot jumping happily with arms raised. High-quality 3D render, glossy textures, playful pose, cinematic lighting against a soft tech-themed background, heroic and celebratory mood."

      </div>
    </main>
    <!-- Success Footer Action -->
    <footer
      class="fixed bottom-0 left-0 w-full z-50 p-6 flex justify-center translate-y-0 transition-transform duration-500 ease-out"
      id="action-footer"
    >
      <div
        class="max-w-md w-full bg-surface/90 backdrop-blur-xl p-4 rounded-xl shadow-[0px_-10px_40px_rgba(77,150,255,0.2)] border border-white/30"

        <button
          class="w-full bg-primary hover:bg-primary/90 text-on-primary font-bold py-5 px-8 rounded-full shadow-[0px_6px_0px_0px_#00468c] active:translate-y-[4px] active:shadow-none transition-all flex items-center justify-center gap-3 group"
        >
          <span class="font-headline-md text-headline-md">CONTINUE</span>
          <span
            class="material-symbols-outlined group-hover:translate-x-1 transition-transform"
            >arrow_forward</span
          >
        </button>
      </div>
    </footer>
    <script>
      // Confetti Generator
      function createConfetti() {
        const container = document.getElementById("confetti-container");
        const colors = ["#005db8", "#7b3bc3", "#10b981", "#ffdf9a", "#4d96ff"];
        const shapes = ["rounded-full", "rotate-45"];

        for (let i = 0; i < 60; i++) {
          const confetti = document.createElement("div");
          const color = colors[Math.floor(Math.random() * colors.length)];
          const shape = shapes[Math.floor(Math.random() * shapes.length)];
          const left = Math.random() * 100;
          const delay = Math.random() * 3;
          const duration = 2 + Math.random() * 2;
          const size = 8 + Math.random() * 12;

          confetti.className = `confetti ${shape} animate-fall`;
          confetti.style.backgroundColor = color;
          confetti.style.left = `${left}vw`;
          confetti.style.top = `-20px`;
          confetti.style.width = `${size}px`;
          confetti.style.height = `${size}px`;
          confetti.style.animationDelay = `${delay}s`;
          confetti.style.animationDuration = `${duration}s`;

          container.appendChild(confetti);

          // Clean up after animation
          setTimeout(
            () => {
              confetti.remove();
            },
            (delay + duration) * 1000,
          );
        }
      }

      // Trigger on load
      window.addEventListener("load", () => {
        createConfetti();
        // Loop confetti occasionally
        setInterval(createConfetti, 4000);
      });

      // Simple button pop animation on page load
      const footer = document.getElementById("action-footer");
      footer.style.transform = "translateY(100px)";
      setTimeout(() => {
        footer.style.transform = "translateY(0)";
      }, 300);
    </script>
  </body>
</html>
